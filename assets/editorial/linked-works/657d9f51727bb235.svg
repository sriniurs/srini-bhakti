      <circle cx="130" cy="64" r="15" fill="#fff"/><circle cx="130" cy="64" r="5" fill="#ffd60a"/>
      <path d="M250 70 L268 34" stroke-width="5"/><path d="M262 26 l10 -2 l-2 10 z" fill="#ddd"/>
