    <text x="70" y="246" text-anchor="middle" font-family="Bangers" font-size="15" fill="#111">MAHISHA (EGO)</text>
    <text x="300" y="246" text-anchor="middle" font-family="Bangers" font-size="15" fill="#111">LION (COURAGE)</text>
